<!DOCTYPE html>
<html>
<head>
    <title>Registration</title>
</head>

<body style="
    background-color: white;
    font-family: Arial;
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;">

<div style="
    background-color: white;
    width: 600px;
    padding: 30px;
    border: 1px solid black;
    border-radius: 10px;
    text-align: left;">

    <h1>Registration</h1>

    <p style="color: black;">Create account</p>

    <form>

    <div style="
        display: flex;
        gap: 20px;">

        <div style="
            width: 70%;
            padding-right: 20px;
            border-right: 1px solid black;">

            <label style="
                display: block;
                text-align: left;
                margin-top: 15px;
                margin-bottom: 5px;
                color: black;">Name*</label>

            <input
                type="text"
                placeholder="Enter username/email"
                style="
                width: 100%;
                padding: 10px;
                box-sizing: border-box;
                border: 1px solid black;
                border-radius: 5px;">

            <label style="
                display: block;
                text-align: left;
                margin-top: 15px;
                margin-bottom: 5px;
                color: black;">Email*</label>

            <input
                type="email"
                placeholder="Enter your email"
                style="
                width: 100%;
                padding: 10px;
                box-sizing: border-box;
                border: 1px solid black;
                border-radius: 5px;">

            <label style="
                display: block;
                text-align: left;
                margin-top: 15px;
                margin-bottom: 5px;
                color: black;">Phone Number*</label>

            <input
                type="text"
                placeholder="Enter phone number"
                style="
                width: 100%;
                padding: 10px;
                box-sizing: border-box;
                border: 1px solid black;
                border-radius: 5px;">

            <label style="
                display: block;
                text-align: left;
                margin-top: 15px;
                margin-bottom: 5px;
                color: black;">Address*</label>

            <input
                type="text"
                placeholder="Enter current address"
                style="
                width: 100%;
                padding: 10px;
                box-sizing: border-box;
                border: 1px solid black;
                border-radius: 5px;">

                            <label style="
                display: block;
                text-align: left;
                margin-top: 15px;
                margin-bottom: 5px;
                color: black;">Create a password*</label>

            <input
                type="password"
                placeholder="Create password"
                style="
                width: 100%;
                padding: 10px;
                box-sizing: border-box;
                border: 1px solid black;
                border-radius: 5px;">

            <label style="
                display: block;
                text-align: left;
                margin-top: 15px;
                margin-bottom: 5px;
                color: black;">Confirm password*</label>

            <input
                type="password"
                placeholder="Confirm password"
                style="
                width: 100%;
                padding: 10px;
                box-sizing: border-box;
                border: 1px solid black;
                border-radius: 5px;">

        </div>

        <div style="
            width: 30%;">

            <label style="
                display: block;
                text-align: left;
                margin-top: 15px;
                margin-bottom: 5px;
                color: black;">Gender</label>

            <select style="
                width: 100%;
                padding: 10px;
                box-sizing: border-box;
                border: 1px solid black;
                border-radius: 5px;">

                <option>Select</option>
                <option>Male</option>
                <option>Female</option>
                <option>Other</option>

            </select>

            <label style="
                display: block;
                text-align: left;
                margin-top: 15px;
                margin-bottom: 5px;
                color: black;">Age</label>

            <input
                type="number"
                placeholder="Age"
                style="
                width: 100%;
                padding: 10px;
                box-sizing: border-box;
                border: 1px solid black;
                border-radius: 5px;">

            <label style="
                display: block;
                text-align: left;
                margin-top: 15px;
                margin-bottom: 5px;
                color: black;">Birthday</label>

            <input
                type="date"
                style="
                width: 100%;
                padding: 10px;
                box-sizing: border-box;
                border: 1px solid black;
                border-radius: 5px;">

        </div>

    </div>

    <button
        type="button"
        style="
        width: 100%;
        padding: 10px;
        margin-top: 20px;
        background-color: white;
        color: black;
        border: 1px solid black;
        border-radius: 5px;">Register</button>

    </form>

    <p style="
        color: black;
        margin-top: 20px;
        text-align: center;">Already have an account?</p>

    <button
        type="button"
        style="
        width: 100%;
        padding: 10px;
        background-color: white;
        color: black;
        border: 1px solid black;
        border-radius: 5px;">Login</button>

</div>

</body>
</html>
